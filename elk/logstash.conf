# DRAFT (R3 Task 4) — annotate before committing. Per the guide, the filter
# section is YOURS to reason through: which field holds your app's JSON after
# Docker's json-file wrapping (hop check 2's rubydebug shows you), and what the
# health-check noise actually looks like in your logs — fix the drop condition
# against reality, not this guess.

input {
  beats {
    port => 5044
  }
}

filter {
  json {
    source => "message"
    skip_on_invalid_json => true
  }
  if ![service] {
    mutate { add_field => { "service" => "%{[container][name]}" } }
  }
  if [logger_name] =~ /actuator/ or [message] =~ /actuator.health/ {
    drop { }
  }

}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "applogs-%{[service]}-%{+YYYY.MM.dd}"
    # Classic daily indices on purpose (ADR 0010): explicit index => already disables data streams;
    # ILM off so the plugin doesn't half-install a rollover policy under a custom name.
    ilm_enabled => false
    # Single node: one shard, zero replicas, or every index sits yellow forever. Installed at
    # Logstash startup so `down -v` + cold start reproduces it (composable template API on ES 9).
    manage_template => true
    template => "/usr/share/logstash/config/applogs-template.json"
    template_name => "applogs"
    template_overwrite => true
  }
}
