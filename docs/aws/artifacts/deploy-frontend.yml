# DRAFT — lives in docs/aws/artifacts/ until Phase 9; move to .github/workflows/ to activate.
# Fill the 3 values in env: before committing there.
name: deploy-frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ROLE_ARN: arn:aws:iam::<ACCOUNT_ID>:role/github-deploy
  BUCKET: <WEB_BUCKET_NAME>
  DISTRIBUTION_ID: <CLOUDFRONT_DISTRIBUTION_ID>

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build   # VITE_API_BASE stays unset — same-origin via CloudFront /api/* behavior
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync to S3
        run: aws s3 sync dist/ "s3://$BUCKET" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
