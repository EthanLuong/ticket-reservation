# DRAFT — lives in docs/aws/artifacts/ until Phase 9; move to .github/workflows/ to activate.
# Fill the 4 values in env: before committing there.
# Auth is GitHub OIDC (no stored AWS keys): the role's trust policy pins this repo + main branch.
name: deploy-backend

on:
  push:
    branches: [main]
    paths: ['src/**', 'pom.xml', 'Dockerfile']
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token — this is the whole point
  contents: read

env:
  AWS_REGION: us-east-2
  ROLE_ARN: arn:aws:iam::<ACCOUNT_ID>:role/github-deploy
  ECR_REPO: ticket-reservation
  ECS_CLUSTER: ticket-reservation
  ECS_SERVICE: ticket-reservation-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Full test suite (Testcontainers — runner has Docker)
        run: ./mvnw --no-transfer-progress verify

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Register new task definition revision with this image
        run: |
          aws ecs describe-task-definition --task-definition ticket-reservation-app \
            --query taskDefinition > taskdef.json
          # strip read-only fields, swap image
          jq --arg IMAGE "$IMAGE" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions[0].image = $IMAGE' taskdef.json > taskdef-new.json
          aws ecs register-task-definition --cli-input-json file://taskdef-new.json
      - name: Roll the service
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition ticket-reservation-app
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
