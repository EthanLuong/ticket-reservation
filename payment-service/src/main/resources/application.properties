spring.application.name=payment-service

# No public API: 8081 stays compose-internal (actuator healthcheck only).
server.port=8081

# JPA: schema is owned by Flyway. Fail startup if entities diverge.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway — fresh V1 history for this service (its schema story starts at its birth).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Datasource wired in R2 Task 4 (payments DB, payment_user creds via env vars).
spring.datasource.url=jdbc:postgresql://localhost:5432/payments
spring.datasource.username=payment_user
spring.datasource.password=${PAYMENT_DB_PASSWORD}

# Actuator (compose healthcheck target; keep minimal)
management.endpoints.web.exposure.include=health,info

# Kafka — mirrors reservation-service's semantics; only the group id differs.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.group-id=payment-service
spring.kafka.listener.ack-mode=MANUAL

spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=lz4

spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
